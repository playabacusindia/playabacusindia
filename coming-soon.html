	<!-- Enquiry Modal -->
	<div class="modal fade" id="enquiryModal" tabindex="-1" aria-labelledby="enquiryModalLabel" aria-hidden="true"
		style="backdrop-filter: blur(5px); background: rgba(0, 0, 0, 0.4);">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content border-0 shadow-lg">
				<div class="modal-header border-0 pb-0 justify-content-center position-relative">
					<img class="mt-2" src="assets/images/logo/horizontallogo.svg"
						style="max-height: 40px; max-width: 80%; object-fit: contain;" alt="IPA Logo">
					<button type="button" class="btn-close position-absolute end-0 top-0 mt-3 me-3"
						data-bs-dismiss="modal" aria-label="Close" style="z-index: 1;"></button>
				</div>
				<div class="modal-body p-4 pt-3">
					<h5 class="text-center mb-4 fw-bold txt-primary-clr" id="enquiryModalLabel">Enquiry Form</h5>
					<form id="enquiryForm">
						<div class="mb-3">
							<input id="modal-name" name="name" class="form-control" placeholder="Your Name" required
								type="text">
						</div>
						<div class="row g-3 mb-3">
							<div class="col-md-6">
								<input id="modal-location" name="location" class="form-control" placeholder="Location"
									required type="text">
							</div>
							<div class="col-md-6">
								<input id="modal-phone" name="phone" class="form-control" placeholder="Phone Number"
									required type="tel">
							</div>
						</div>
						<div class="mb-3">
							<input id="modal-email" name="email" class="form-control" placeholder="Gmail" type="email">
						</div>
						<div class="mb-3">
							<select id="modal-type" name="enquiry_type" class="form-select">
								<option value="" disabled selected>Select Enquiry Type</option>
								<option value="Student Admission">Student Admission</option>
								<option value="Contact">Contact</option>
								<option value="Franchise">Franchise</option>
							</select>
						</div>
						<div class="mb-3">
							<textarea id="modal-message" name="message" placeholder="Your Message (Optional)"
								class="form-control" rows="3"></textarea>
						</div>
						<button id="modalSendBtn" type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2">
							<span class="spinner-border spinner-border-sm d-none me-2" role="status"
								aria-hidden="true"></span>
							Submit
						</button>
					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- Success Toast -->
	<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">

					Thx for the Enquiry Now soon our ipa team will contact you asps

				<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
